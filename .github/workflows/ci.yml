name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository self-check (structure, syntax, asset links)
        run: node scripts/check.js

      - name: Unit tests
        run: node --test test/*.test.js
